<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1544" height="500" viewBox="0 0 1544 500">
	<title>Block Minimap</title>
	<defs>
		<!-- One post layout, 360 wide, drawn twice: blurred as the editor canvas and shrunk as the minimap. -->
		<g id="post">
			<rect x="0" y="0" width="240" height="28" rx="3" fill="#1d2327"/>
			<rect x="0" y="48" width="360" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="66" width="360" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="84" width="250" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="112" width="360" height="150" rx="4" fill="#c3c4c7"/>
			<path d="M24 238l70-74 46 46 34-30 70 58z" fill="#a7aaad"/>
			<circle cx="300" cy="154" r="18" fill="#a7aaad"/>
			<rect x="0" y="284" width="360" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="302" width="360" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="320" width="200" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="352" width="180" height="20" rx="3" fill="#50575e"/>
			<rect x="1" y="393" width="168" height="118" rx="4" fill="#fff" stroke="#c3c4c7" stroke-width="2"/>
			<rect x="14" y="406" width="142" height="50" rx="3" fill="#dcdcde"/>
			<rect x="14" y="470" width="142" height="9" rx="3" fill="#a7aaad"/>
			<rect x="14" y="486" width="100" height="9" rx="3" fill="#a7aaad"/>
			<rect x="191" y="393" width="168" height="118" rx="4" fill="#fff" stroke="#c3c4c7" stroke-width="2"/>
			<rect x="204" y="406" width="142" height="50" rx="3" fill="#dcdcde"/>
			<rect x="204" y="470" width="142" height="9" rx="3" fill="#a7aaad"/>
			<rect x="204" y="486" width="100" height="9" rx="3" fill="#a7aaad"/>
			<rect x="0" y="536" width="6" height="64" rx="2" fill="#50575e"/>
			<rect x="22" y="542" width="320" height="10" rx="3" fill="#8c8f94"/>
			<rect x="22" y="560" width="320" height="10" rx="3" fill="#8c8f94"/>
			<rect x="22" y="578" width="210" height="10" rx="3" fill="#8c8f94"/>
			<rect x="0" y="624" width="360" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="642" width="360" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="660" width="280" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="690" width="112" height="90" rx="4" fill="#c3c4c7"/>
			<rect x="124" y="690" width="112" height="90" rx="4" fill="#c3c4c7"/>
			<rect x="248" y="690" width="112" height="90" rx="4" fill="#c3c4c7"/>
			<rect x="0" y="802" width="360" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="820" width="360" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="838" width="230" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="870" width="200" height="20" rx="3" fill="#50575e"/>
			<rect x="0" y="910" width="360" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="928" width="360" height="10" rx="3" fill="#a7aaad"/>
			<rect x="0" y="946" width="160" height="10" rx="3" fill="#a7aaad"/>
		</g>
		<clipPath id="canvas-clip">
			<rect x="760" y="0" width="420" height="500"/>
		</clipPath>
		<filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
			<feGaussianBlur stdDeviation="3"/>
		</filter>
		<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#f0f0f1" stop-opacity="1"/>
			<stop offset="1" stop-color="#f0f0f1" stop-opacity="0"/>
		</linearGradient>
	</defs>

	<rect width="1544" height="500" fill="#f0f0f1"/>

	<!-- The editor canvas, out of focus and scrolled partway down the post. -->
	<g opacity="0.75" filter="url(#soft)">
		<g clip-path="url(#canvas-clip)">
			<rect x="760" y="0" width="420" height="500" fill="#fff"/>
			<use xlink:href="#post" transform="translate(790 -260)"/>
		</g>
	</g>
	<rect x="740" y="0" width="80" height="500" fill="url(#fade)"/>

	<!-- The minimap strip, with the viewport over the part the canvas shows. -->
	<rect x="1222" y="71" width="148" height="358" rx="6" fill="#fff" stroke="#c3c4c7" stroke-width="2"/>
	<use xlink:href="#post" transform="translate(1236 86) scale(0.3333)"/>
	<rect x="1209" y="170" width="174" height="170" rx="5" fill="#2271b1" fill-opacity="0.2" stroke="#2271b1" stroke-width="5"/>

	<!-- Plugin name. -->
	<text x="112" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="80" font-weight="700" fill="#1d2327" letter-spacing="-1">Block Minimap</text>
	<text x="114" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" fill="#50575e">See your whole post at a glance</text>
</svg>
