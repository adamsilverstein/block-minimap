name: Deploy to WordPress.org Plugin Directory

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every step but skip the SVN commit
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    permissions:
      # Needed to attach the zip to the GitHub release.
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the editor bundle
        # Build from src so SVN gets the bundle the tagged source produces,
        # even if the committed dist was not rebuilt before tagging.
        run: npm run build

      - name: Read the version from the plugin header
        # A manual run from a branch has no tag for the action to read the
        # version from, so take it from the header instead. Release runs
        # leave this empty and the action uses the release tag.
        id: version
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "version=$(sed -n 's/^ \* Version: *//p' block-minimap.php)" >> "$GITHUB_OUTPUT"

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
          # A manual run is a dry run unless the input is switched off.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: block-minimap
          VERSION: ${{ steps.version.outputs.version }}

      - name: Attach the zip to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.deploy.outputs.zip-path }}" --clobber
