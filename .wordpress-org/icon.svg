<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
	<title>Block Minimap</title>
	<rect width="256" height="256" fill="#f0f0f1"/>
	<!-- The minimap strip: a long post that runs off the bottom edge. -->
	<path d="M70 34a6 6 0 0 1 6-6h104a6 6 0 0 1 6 6v222H70z" fill="#fff" stroke="#c3c4c7" stroke-width="3"/>
	<!-- Heading and paragraph. -->
	<rect x="84" y="44" width="88" height="14" rx="2" fill="#1d2327"/>
	<rect x="84" y="68" width="88" height="7" rx="2" fill="#8c8f94"/>
	<rect x="84" y="82" width="64" height="7" rx="2" fill="#8c8f94"/>
	<!-- Image tile. -->
	<rect x="84" y="108" width="88" height="48" rx="3" fill="#8c8f94"/>
	<!-- Two columns. -->
	<rect x="84" y="166" width="40" height="30" rx="3" fill="#a7aaad"/>
	<rect x="132" y="166" width="40" height="30" rx="3" fill="#a7aaad"/>
	<!-- More paragraphs below the fold. -->
	<rect x="84" y="214" width="88" height="7" rx="2" fill="#8c8f94"/>
	<rect x="84" y="228" width="88" height="7" rx="2" fill="#8c8f94"/>
	<rect x="84" y="242" width="56" height="7" rx="2" fill="#8c8f94"/>
	<!-- The viewport overlay. -->
	<rect x="54" y="98" width="148" height="108" rx="4" fill="#2271b1" fill-opacity="0.22" stroke="#2271b1" stroke-width="6"/>
</svg>
